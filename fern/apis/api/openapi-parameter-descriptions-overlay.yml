overlay: 1.0.0
info:
  title: Document API parameters and preserve response parsing
  version: 1.0.0
actions:
  # Python parses undiscriminated union members in order. The preview member
  # has no required fields and accepts extras, so it must follow the rerun
  # member to preserve workflowId parsing. Remove first to replace the array
  # without merging its members with the original schemas.
  - target: $.paths['/structured-output/run'].post.responses['200'].content['application/json'].schema.oneOf
    remove: true
  - target: $.paths['/structured-output/run'].post.responses['200'].content['application/json'].schema
    update:
      oneOf:
        - title: StructuredOutputRerunResponse
          $ref: '#/components/schemas/StructuredOutputRerunResponse'
        - title: StructuredOutputRunPreviewResponse
          allOf:
            - $ref: '#/components/schemas/StructuredOutputRunPreviewResponse'
            - additionalProperties:
                $ref: '#/components/schemas/StructuredOutputRunResult'
  # These variants are present in the API's oneOf lists. Their schemas declare
  # the exact discriminator values below; include them in the mappings too.
  - target: $.paths['/tool'].post.requestBody.content['application/json'].schema.discriminator.mapping
    update:
      code: '#/components/schemas/CreateCodeToolDTO'
  - target: $.paths['/tool/{id}'].patch.requestBody.content['application/json'].schema.discriminator.mapping
    update:
      code: '#/components/schemas/UpdateCodeToolDTO'
  - target: $.paths['/tool'].get.responses['200'].content['application/json'].schema.items.discriminator.mapping
    update:
      ghl: '#/components/schemas/GhlTool'
  - target: $.paths['/tool'].post.responses['201'].content['application/json'].schema.discriminator.mapping
    update:
      ghl: '#/components/schemas/GhlTool'
  - target: $.paths['/tool/{id}'].get.responses['200'].content['application/json'].schema.discriminator.mapping
    update:
      ghl: '#/components/schemas/GhlTool'
  - target: $.paths['/tool/{id}'].patch.responses['200'].content['application/json'].schema.discriminator.mapping
    update:
      ghl: '#/components/schemas/GhlTool'
  - target: $.paths['/tool/{id}'].delete.responses['200'].content['application/json'].schema.discriminator.mapping
    update:
      ghl: '#/components/schemas/GhlTool'
  # Path parameters
  - target: $.paths['/assistant/{id}'].*.parameters[?(@.name == 'id' && @.in == 'path')]
    update:
      description: The unique identifier of the assistant.
  - target: $.paths['/squad/{id}'].*.parameters[?(@.name == 'id' && @.in == 'path')]
    update:
      description: The unique identifier of the squad.
  - target: $.paths['/call/{id}'].*.parameters[?(@.name == 'id' && @.in == 'path')]
    update:
      description: The unique identifier of the call.
  - target: $.paths['/campaign/{id}'].*.parameters[?(@.name == 'id' && @.in == 'path')]
    update:
      description: The unique identifier of the campaign.
  - target: $.paths['/phone-number/{id}'].*.parameters[?(@.name == 'id' && @.in == 'path')]
    update:
      description: The unique identifier of the phone number.
  - target: $.paths['/tool/{id}'].*.parameters[?(@.name == 'id' && @.in == 'path')]
    update:
      description: The unique identifier of the tool.
  - target: $.paths['/file/{id}'].*.parameters[?(@.name == 'id' && @.in == 'path')]
    update:
      description: The unique identifier of the file.
  - target: $.paths['/structured-output/{id}'].*.parameters[?(@.name == 'id' && @.in == 'path')]
    update:
      description: The unique identifier of the structured output.
  - target: $.paths['/reporting/insight/{id}'].*.parameters[?(@.name == 'id' && @.in == 'path')]
    update:
      description: The unique identifier of the reporting insight.
  - target: $.paths['/reporting/insight/{id}/run'].post.parameters[?(@.name == 'id' && @.in == 'path')]
    update:
      description: The unique identifier of the reporting insight.
  - target: $.paths['/eval/{id}'].*.parameters[?(@.name == 'id' && @.in == 'path')]
    update:
      description: The unique identifier of the eval definition.
  - target: $.paths['/eval/run/{id}'].*.parameters[?(@.name == 'id' && @.in == 'path')]
    update:
      description: The unique identifier of the eval run.
  - target: $.paths['/observability/scorecard/{id}'].*.parameters[?(@.name == 'id' && @.in == 'path')]
    update:
      description: The unique identifier of the scorecard.
  - target: $.paths['/provider/{provider}/{resourceName}/{id}'].*.parameters[?(@.name == 'id' && @.in == 'path')]
    update:
      description: The unique identifier of the provider resource.

  # Query parameters
  - target: $.paths['/campaign'].get.parameters[?(@.name == 'id' && @.in == 'query')]
    update:
      description: Filters campaigns by ID.
  - target: $.paths['/campaign'].get.parameters[?(@.name == 'status' && @.in == 'query')]
    update:
      description: Filters campaigns by status.
  - target: $.paths['/structured-output/{id}'].patch.parameters[?(@.name == 'schemaOverride' && @.in == 'query')]
    update:
      description: Set to the string `true` to allow changing the schema's top-level type. Other values do not enable schema type changes.
  - target: $.paths['/reporting/insight'].get.parameters[?(@.name == 'id' && @.in == 'query')]
    update:
      description: Filters reporting insights by ID.
  - target: $.paths['/eval'].get.parameters[?(@.name == 'id' && @.in == 'query')]
    update:
      description: Filters eval definitions by ID.
  - target: $.paths['/eval/run'].get.parameters[?(@.name == 'id' && @.in == 'query')]
    update:
      description: Filters eval runs by ID.
  - target: $.paths['/observability/scorecard'].get.parameters[?(@.name == 'id' && @.in == 'query')]
    update:
      description: Filters scorecards by ID.
  - target: $.paths['/provider/{provider}/{resourceName}'].get.parameters[?(@.name == 'id' && @.in == 'query')]
    update:
      description: Filters provider resources by their resource ID.
  - target: $.paths['/provider/{provider}/{resourceName}'].get.parameters[?(@.name == 'resourceId' && @.in == 'query')]
    update:
      description: Filters provider resources by their provider-specific resource ID.

  # Simulations (staged — /eval/simulation/* not yet in openapi.json; these targets no-op until synced)
  # Path parameters
  - target: $.paths['/eval/simulation/personality/{id}'].*.parameters[?(@.name == 'id' && @.in == 'path')]
    update:
      description: The unique identifier of the personality.
  - target: $.paths['/eval/simulation/scenario/{id}'].*.parameters[?(@.name == 'id' && @.in == 'path')]
    update:
      description: The unique identifier of the scenario.
  - target: $.paths['/eval/simulation/{id}'].*.parameters[?(@.name == 'id' && @.in == 'path')]
    update:
      description: The unique identifier of the simulation.
  - target: $.paths['/eval/simulation/suite/{id}'].*.parameters[?(@.name == 'id' && @.in == 'path')]
    update:
      description: The unique identifier of the simulation suite.
  - target: $.paths['/eval/simulation/run/{id}'].*.parameters[?(@.name == 'id' && @.in == 'path')]
    update:
      description: The unique identifier of the simulation run.
  - target: $.paths['/eval/simulation/run/{id}/item'].*.parameters[?(@.name == 'id' && @.in == 'path')]
    update:
      description: The unique identifier of the simulation run.
  - target: $.paths['/eval/simulation/run/{id}/item/{itemId}'].*.parameters[?(@.name == 'id' && @.in == 'path')]
    update:
      description: The unique identifier of the simulation run.
  - target: $.paths['/eval/simulation/run/{id}/item/{itemId}'].*.parameters[?(@.name == 'itemId' && @.in == 'path')]
    update:
      description: The unique identifier of the run item.
  - target: $.paths['/eval/simulation/run/{id}/item/{itemId}/generate'].*.parameters[?(@.name == 'id' && @.in == 'path')]
    update:
      description: The unique identifier of the simulation run.
  - target: $.paths['/eval/simulation/run/{id}/item/{itemId}/generate'].*.parameters[?(@.name == 'itemId' && @.in == 'path')]
    update:
      description: The unique identifier of the run item.
  # Query parameters
  - target: $.paths['/eval/simulation/run/{id}/item'].get.parameters[?(@.name == 'simulationId' && @.in == 'query')]
    update:
      description: Filters run items to a specific simulation.
  - target: $.paths['/eval/simulation/run/{id}/item'].get.parameters[?(@.name == 'runId' && @.in == 'query')]
    update:
      description: Filters run items to a specific run.
  - target: $.paths['/eval/simulation/run/{id}/item'].get.parameters[?(@.name == 'status' && @.in == 'query')]
    update:
      description: Filters run items by status.
  - target: $.paths['/eval/simulation/run/{id}/item/{itemId}/generate'].post.parameters[?(@.name == 'force' && @.in == 'query')]
    update:
      description: Set to the string `true` to regenerate improvement suggestions even if they already exist.
  # GET /v2/call reads structured-output and score filters from the nested
  # `artifact` query object (`artifact[structuredOutputs][<id>][eq]=...`,
  # `artifact[score][gte]=...`). The generated spec flattens them to top-level
  # `structuredOutputs` and `score`, which the API rejects with a 400
  # ("property ... should not exist"). Hide them until the API documents
  # `artifact` correctly.
  - target: $.paths['/v2/call'].get.parameters[?(@.name == 'structuredOutputs' && @.in == 'query')]
    remove: true
  - target: $.paths['/v2/call'].get.parameters[?(@.name == 'score' && @.in == 'query')]
    remove: true
  # The API declares these object filters as untyped `type: object`, so the
  # SDKs send them as a JSON string (`customer={"number":...}`), which the API
  # rejects with a 400 ("customer must be an object"). The API parses
  # bracketed keys (`customer[number]=...`). Type them and mark them
  # deepObject so the SDKs send that form.
  - target: $.paths['/v2/call'].get.parameters[?(@.name == 'customer' && @.in == 'query')]
    update:
      style: deepObject
      explode: true
  - target: $.paths['/v2/call'].get.parameters[?(@.name == 'customer' && @.in == 'query')].schema
    update:
      title: CallListCustomerFilter
      properties:
        number:
          type: string
          description: Matches calls whose customer has this phone number.
        name:
          type: string
          description: Matches calls whose customer has this name.
        externalId:
          type: string
          description: Matches calls whose customer has this external ID.
        extension:
          type: string
          description: Matches calls whose customer has this extension.
  - target: $.paths['/v2/call'].get.parameters[?(@.name == 'assistantOverrides' && @.in == 'query')]
    update:
      style: deepObject
      explode: true
  - target: $.paths['/v2/call'].get.parameters[?(@.name == 'assistantOverrides' && @.in == 'query')].schema
    update:
      title: CallListAssistantOverridesFilter
      properties:
        variableValues:
          type: object
          additionalProperties:
            type: string
          description: >-
            Matches calls whose assistant overrides set these template
            variables to these values.
  - target: $.paths['/v2/call'].get.parameters[?(@.name == 'cursor' && @.in == 'query')]
    update:
      description: >-
        Opaque cursor for keyset pagination. Pass `metadata.nextCursor` from
        the previous page to fetch the next one. Honored only for the default
        `createdAt` sort; `duration` and `cost` sorts use `page`.
  # GET /v2/assistant always sorts by creation time and ignores `sortBy`.
  - target: $.paths['/v2/assistant'].get.parameters[?(@.name == 'sortBy' && @.in == 'query')]
    remove: true
