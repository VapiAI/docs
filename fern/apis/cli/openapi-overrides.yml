# OpenAPI reserves Content-Type for requestBody.content. The upstream
# provider-resource endpoint declares it as a required header instead.
# Fern's IR ignores that header, while the generated runtime requires it.
# Keep the flag available, but let the HTTP stack set Content-Type when
# --json is supplied; callers can still choose --content-type explicitly.
paths:
  /provider/{provider}/{resourceName}:
    post:
      parameters:
        - name: content-type
          in: header
          required: false
          schema:
            type: string

# The beta's OAuth issuer and API audience are staging-only. Keep its default
# server in staging too, rather than sending staging credentials to production.
servers:
  - url: https://staging-api.vapi.ai
components:
  securitySchemes:
    bearer:
      type: oauth2
      scheme: null
      bearerFormat: null
      description: Sign in with `vapi auth login`. The CLI uses public-client OAuth with PKCE and refreshes access tokens automatically.
      flows:
        authorizationCode:
          authorizationUrl: https://nourishing-mulberry-12-staging.authkit.app/oauth2/authorize
          tokenUrl: https://nourishing-mulberry-12-staging.authkit.app/oauth2/token
          refreshUrl: https://nourishing-mulberry-12-staging.authkit.app/oauth2/token
          scopes:
            openid: Sign in
            offline_access: Refresh access
    # The shared SDK override adds this unused API-key scheme. The CLI uses
    # only the OAuth scheme referenced by the API operations.
    BearerAuth: null
