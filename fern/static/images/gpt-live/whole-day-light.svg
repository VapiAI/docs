<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 156" width="640" height="156" role="img" aria-labelledby="vapi-07-whole-day-light-title vapi-07-whole-day-light-desc"><title id="vapi-07-whole-day-light-title">Three returned times on one day line, with 4:00 PM inside an after-3-PM preference</title><desc id="vapi-07-whole-day-light-desc">Conceptual illustration using the open times from the docs example. A horizontal line for one day, with faint hour ticks, holds three dots labelled 10:30 AM, 2:30 PM and 4:00 PM. A faint curve beneath gathers the three as one result. From 3 PM to the end of the day, a soft mint light rises from the line, labelled after 3 PM. Only the 4:00 PM dot lies inside it, ringed in mint.</desc><defs><linearGradient id="vapi-07-whole-day-light-g0" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="0" y2="96"><stop offset="0" stop-color="#00CD8F" stop-opacity="0"/><stop offset="1" stop-color="#00CD8F" stop-opacity="0.24"/></linearGradient></defs><path d="M465 40L608 40L608 96L465 96Z" fill="url(#vapi-07-whole-day-light-g0)"/><path d="M574.1 93.9h0M551.5 68.1h0M535 94h0M493 68.3h0M508.5 83.7h0M599.9 66.9h0M542.3 77.2h0M583.6 78.4h0M601.6 82.2h0M560.7 77.4h0M569 95h0M550.1 70h0M475 96h0M506.5 68h0M485.5 50.4h0M471.1 86.4h0M488.8 91.3h0M526.6 92.4h0M543.6 91.4h0M532.9 74.3h0M512.4 48.2h0M583.7 86.5h0M575 81.2h0M480.3 52h0M549.6 92.4h0M546.1 92.7h0M524.1 64.8h0M588.6 89.9h0M495.1 92h0M495.6 64.5h0M495 76.5h0M488.3 60h0M514.1 93.9h0M549.8 93.4h0M524.6 85.2h0M507 56.8h0M508.4 53.2h0M576.8 76.5h0M589.1 90.1h0M576.3 66.5h0M531.8 59.6h0M532.7 67.3h0M520.6 42.1h0M514 94.8h0M505.7 56.5h0M519.4 96h0M521.6 95h0M549.8 51.7h0M576.9 43.6h0M507.1 84.9h0M489.5 71h0M594.2 95.4h0M519 55.5h0M598.5 50.2h0M587.9 46.7h0M567.6 87.2h0M527.4 56.2h0M550.7 70.9h0M578.7 94.5h0M577.8 61.5h0M503.1 77.5h0M561.5 91.1h0M556.2 92.2h0M504.5 68.5h0M554.5 95.1h0M570.2 95.7h0M551.7 75.8h0M588.8 71.9h0M477.3 96h0M478.8 78.2h0M584.5 50.5h0M504.6 45.9h0M530.6 67.8h0M546.9 95.8h0M48