<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1048" width="360" height="1048" role="img" aria-labelledby="vapi-05-squad-to-skills-dark-c-title vapi-05-squad-to-skills-dark-c-desc"><title id="vapi-05-squad-to-skills-dark-c-title">A squad of a front desk, scheduling and service information assistants mapped onto one GPT-Live assistant: the front desk to the speaker, each specialist to a skill in the reasoner</title><desc id="vapi-05-squad-to-skills-dark-c-desc">Before-and-after diagram. Top, labelled Squad: three assistant cards, Front desk (greeting, routing), Scheduling (booking procedure, booking tools) and Service information (service answers, info tool). Dashed arrows labelled Hands off go from the front desk to the other two. Bottom, labelled One GPT-Live assistant: a Speaker whose prompt holds greeting and tone and delegation triggers, and a Reasoner whose prompt holds shared rules. Inside the reasoner are two skills. Scheduling has the description “Book, move, cancel”, a procedure, and the tools Availability, Book and Cancel. Service questions has the description “Hours and policies”, guidance, and uses Business info. Base tools Business info and End call sit in the reasoner. Mint arrows connect each squad member to where it goes: front desk to the speaker (greeting, routing), Scheduling to the Scheduling skill (procedure, tools), Service information to the Service questions skill (guidance). The compact layout uses “From …” labels in place of arrows.</desc><text x="16" y="28" fill="#FEFEFE" font-family="Avantt, 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600">Squad</text><path d="M68 44L332 44C338.6 44 344 49.4 344 56L344 112C344 118.6 338.6 124 332 124L68 124C61.4 124 56 118.6 56 112L56 56C56 49.4 61.4 44 68 44Z" fill="#111013"/><path d="M68 44L332 44C338.6 44 344 49.4 344 56L344 112C344 118.6 338.6 124 332 124L68 124C61.4 124 56 118.6 56 112L56 56C56 49.4 61.4 44 68 44Z" fill="