<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 906" width="360" height="906" role="img" aria-labelledby="vapi-04-before-after-loading-light-c-title vapi-04-before-after-loading-light-c-desc"><title id="vapi-04-before-after-loading-light-c-title">A caller talks to the speaker, which delegates tasks to the reasoner. The reasoner holds its prompt, base tools and the skill catalog, where Scheduling is loaded with its full instructions and tools</title><desc id="vapi-04-before-after-loading-light-c-desc">Diagram of one GPT-Live assistant. A person labelled Caller is joined to a box labelled Speaker, which holds a Speaker prompt. An arrow labelled Delegates a task leads down to a box labelled Reasoner, and an arrow labelled Returns results leads back up. The reasoner holds a Reasoner prompt, Base tools (Business info and End call, always available) and a Skill catalog. In the catalog, Scheduling is marked Loaded and shows its description, full instructions, and the tools Availability, Book and Cancel. Service questions shows only its name and description, marked Not loaded.</desc><path d="M48.4 37C48.4 41.6 44.6 45.4 40 45.4C35.4 45.4 31.6 41.6 31.6 37C31.6 32.4 35.4 28.6 40 28.6C44.6 28.6 48.4 32.4 48.4 37ZM24.4 67C24.4 52 32 48.4 40 48.4C48 48.4 55.6 52 55.6 67" fill="none" stroke="#111013" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="54" fill="#6B6A70" font-family="Avantt, 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15">Caller</text><path d="M40 78L40 104" fill="none" stroke="#111013" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85"/><path d="M44.5 104C44.5 106.5 42.5 108.5 40 108.5C37.5 108.5 35.5 106.5 35.5 104C35.5 101.5 37.5 99.5 40 99.5C42.5 99.5 44.5 101.5 44.5 104Z" fill="#00CD8F"/><path d="M28 104L332 104C340.8 104 348 111.2 348 120L348 222C348 230.8 340.8 238 332 238L28 238C19.2 238 12 230.8 12 222L12 120C12 111.2 19.2 104