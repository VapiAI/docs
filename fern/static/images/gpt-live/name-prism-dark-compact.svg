<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 244" width="360" height="244" role="img" aria-labelledby="vapi-05-name-prism-dark-c-title vapi-05-name-prism-dark-c-desc"><title id="vapi-05-name-prism-dark-c-title">A spoken name splitting into several spellings through a prism</title><desc id="vapi-05-name-prism-dark-c-desc">Conceptual illustration. A short spoken wave travels into a glass prism drawn in fine lines with a faint lavender tint. Three rays leave the far side, ending at the spellings Shivaun, Siobhan and Chevonne. Soft lavender, mint and blue light gathers where they exit. The ray to Siobhan is mint; the other two rays are grey.</desc><defs><linearGradient id="vapi-05-name-prism-dark-c-g0" gradientUnits="userSpaceOnUse" x1="0" y1="92" x2="0" y2="200"><stop offset="0" stop-color="#D3BEFE" stop-opacity="0.16"/><stop offset="1" stop-color="#D3BEFE" stop-opacity="0.03"/></linearGradient><filter id="vapi-05-name-prism-dark-c-b1" x="165.3" y="122" width="58" height="50" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="6"/></filter><filter id="vapi-05-name-prism-dark-c-b2" x="165.3" y="135" width="58" height="50" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="6"/></filter><filter id="vapi-05-name-prism-dark-c-b3" x="165.3" y="148" width="58" height="50" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="6"/></filter></defs><path d="M152 92L106 200L198 200Z" fill="url(#vapi-05-name-prism-dark-c-g0)"/><path d="M148.3 100.6L190.6 200M144.2 110.4L182.4 200" fill="none" stroke="#A09FA6" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.35"/><path d="M16 150L127.3 150L179.3 156" fill="none" stroke="#FEFEFE" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/><path d="M34 150C40.9 138.3 50 138.3 56.9 150C63.1 133.3 71.5 133.3 77.7 150C84.4 138 93.3 138 100 150M34 150C40.9 161.7 50 161.7 56.9 150C63.1 166.7 71.5 166.7 77.7 150C84.4 162 93.3 162 100 150M34 150C40.9