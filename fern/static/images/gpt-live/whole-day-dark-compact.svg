<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150" width="360" height="150" role="img" aria-labelledby="vapi-07-whole-day-dark-c-title vapi-07-whole-day-dark-c-desc"><title id="vapi-07-whole-day-dark-c-title">Three returned times on one day line, with 4:00 PM inside an after-3-PM preference</title><desc id="vapi-07-whole-day-dark-c-desc">Conceptual illustration using the open times from the docs example. A horizontal line for one day, with faint hour ticks, holds three dots labelled 10:30 AM, 2:30 PM and 4:00 PM. A faint curve beneath gathers the three as one result. From 3 PM to the end of the day, a soft mint light rises from the line, labelled after 3 PM. Only the 4:00 PM dot lies inside it, ringed in mint.</desc><defs><linearGradient id="vapi-07-whole-day-dark-c-g0" gradientUnits="userSpaceOnUse" x1="0" y1="42" x2="0" y2="92"><stop offset="0" stop-color="#00CD8F" stop-opacity="0"/><stop offset="1" stop-color="#00CD8F" stop-opacity="0.3"/></linearGradient></defs><path d="M255 42L338 42L338 92L255 92Z" fill="url(#vapi-07-whole-day-dark-c-g0)"/><path d="M318.3 90.2h0M305.2 67.1h0M295.6 90.2h0M271.2 67.3h0M280.2 81h0M333.3 66h0M299.9 75.2h0M323.8 76.2h0M334.3 79.6h0M310.6 75.4h0M315.4 91.1h0M304.4 68.8h0M260.8 92h0M279.1 67h0M266.9 51.2h0M258.5 83.4h0M268.8 87.8h0M290.8 88.8h0M300.6 87.9h0M294.4 72.6h0M282.5 49.3h0M323.9 83.5h0M318.8 78.8h0M263.9 52.7h0M304.1 88.8h0M302.1 89.1h0M289.3 64.1h0M326.7 86.5h0M272.5 88.5h0M272.8 63.9h0M272.4 74.6h0M268.5 59.8h0M283.5 90.1h0M304.2 89.6h0M289.6 82.4h0M279.4 57h0M280.2 53.8h0M319.9 74.6h0M327 86.7h0M319.6 65.6h0M293.8 59.5h0M294.3 66.4h0M287.3 43.8h0M283.4 91h0M278.6 56.7h0M286.6 92h0M287.9 91.1h0M304.2 52.4h0M319.9 45.2h0M279.5 82.1h0M269.2 69.7h0M330 91.4h0M286.3 55.9h0M332.5 51.1h0M326.4 48h0M314.6 84.2h0M291.2 56.5h0M304.7 69.6h0M321 90.7h0M320.5 61.2h0M277.1 75.4h0M311 87.7h0M308 88.6h0M277.9 67.4h0M307 91.2h0M316.1 91.8h0M305.3 74h0M326.9 70.5h0M262.1 92h0M263 76.1h0" fill="none" stroke="#00CD8F" stroke-widt