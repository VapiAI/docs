<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 728" width="640" height="728" role="img" aria-labelledby="vapi-05-squad-to-skills-light-title vapi-05-squad-to-skills-light-desc"><title id="vapi-05-squad-to-skills-light-title">A squad of a front desk, scheduling and service information assistants mapped onto one GPT-Live assistant: the front desk to the speaker, each specialist to a skill in the reasoner</title><desc id="vapi-05-squad-to-skills-light-desc">Before-and-after diagram. Top, labelled Squad: three assistant cards, Front desk (greeting, routing), Scheduling (booking procedure, booking tools) and Service information (service answers, info tool). Dashed arrows labelled Hands off go from the front desk to the other two. Bottom, labelled One GPT-Live assistant: a Speaker whose prompt holds greeting and tone and delegation triggers, and a Reasoner whose prompt holds shared rules. Inside the reasoner are two skills. Scheduling has the description “Book, move, cancel”, a procedure, and the tools Availability, Book and Cancel. Service questions has the description “Hours and policies”, guidance, and uses Business info. Base tools Business info and End call sit in the reasoner. Mint arrows connect each squad member to where it goes: front desk to the speaker (greeting, routing), Scheduling to the Scheduling skill (procedure, tools), Service information to the Service questions skill (guidance). The compact layout uses “From …” labels in place of arrows.</desc><text x="16" y="30" fill="#111013" font-family="Avantt, 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600">Squad</text><path d="M28 100L188 100C194.6 100 200 105.4 200 112L200 188C200 194.6 194.6 200 188 200L28 200C21.4 200 16 194.6 16 188L16 112C16 105.4 21.4 100 28 100Z" fill="#FEFEFE"/><path d="M28 100L188 100C194.6 100 200 105.4 200 112L200 188C200 194.6 194.6 200 188 200L28 200C21.4 200 16 194.6 16 188L16 112C16 105.4 21.4 100 28 