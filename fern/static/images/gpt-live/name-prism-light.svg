<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 244" width="640" height="244" role="img" aria-labelledby="vapi-05-name-prism-light-title vapi-05-name-prism-light-desc"><title id="vapi-05-name-prism-light-title">A spoken name splitting into several spellings through a prism</title><desc id="vapi-05-name-prism-light-desc">Conceptual illustration. A short spoken wave travels into a glass prism drawn in fine lines with a faint lavender tint. Three rays leave the far side, ending at the spellings Shivaun, Siobhan and Chevonne. Soft lavender, mint and blue light gathers where they exit. The ray to Siobhan is mint; the other two rays are grey.</desc><defs><linearGradient id="vapi-05-name-prism-light-g0" gradientUnits="userSpaceOnUse" x1="0" y1="80" x2="0" y2="210"><stop offset="0" stop-color="#D3BEFE" stop-opacity="0.22"/><stop offset="1" stop-color="#D3BEFE" stop-opacity="0.03"/></linearGradient><filter id="vapi-05-name-prism-light-b1" x="324.6" y="122" width="58" height="50" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="6"/></filter><filter id="vapi-05-name-prism-light-b2" x="324.6" y="135" width="58" height="50" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="6"/></filter><filter id="vapi-05-name-prism-light-b3" x="324.6" y="148" width="58" height="50" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="6"/></filter></defs><path d="M300 80L234 210L366 210Z" fill="url(#vapi-05-name-prism-light-g0)"/><path d="M294.7 90.4L355.4 210M288.8 102.1L343.6 210" fill="none" stroke="#6B6A70" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.35"/><path d="M40 150L264.5 150L338.6 156" fill="none" stroke="#111013" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/><path d="M96 150C108.3 136 124.6 136 136.9 150C148.1 129.9 163 129.9 174.2 150C186.1 135.6 202 135.6 214 150M96 150C108.3 164 124.6 164 136.9 150C148.1 170.1 163 170.1 174.2 150C186.1 164.4 202 164.4 214 150M96 150C10