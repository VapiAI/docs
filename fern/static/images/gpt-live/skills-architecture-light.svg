<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 644" width="640" height="644" role="img" aria-labelledby="vapi-04-before-after-loading-light-title vapi-04-before-after-loading-light-desc"><title id="vapi-04-before-after-loading-light-title">A caller talks to the speaker, which delegates tasks to the reasoner. The reasoner holds its prompt, base tools and the skill catalog, where Scheduling is loaded with its full instructions and tools</title><desc id="vapi-04-before-after-loading-light-desc">Diagram of one GPT-Live assistant. A person labelled Caller is joined to a box labelled Speaker, which holds a Speaker prompt. An arrow labelled Delegates a task leads down to a box labelled Reasoner, and an arrow labelled Returns results leads back up. The reasoner holds a Reasoner prompt, Base tools (Business info and End call, always available) and a Skill catalog. In the catalog, Scheduling is marked Loaded and shows its description, full instructions, and the tools Availability, Book and Cancel. Service questions shows only its name and description, marked Not loaded.</desc><path d="M57.2 73.9C57.2 79 53.1 83.1 48 83.1C42.9 83.1 38.8 79 38.8 73.9C38.8 68.8 42.9 64.7 48 64.7C53.1 64.7 57.2 68.8 57.2 73.9ZM30.8 106.9C30.8 90.4 39.2 86.4 48 86.4C56.8 86.4 65.2 90.4 65.2 106.9" fill="none" stroke="#111013" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="130.9" fill="#6B6A70" font-family="Avantt, 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" text-anchor="middle">Caller</text><path d="M82 90L104 90" fill="none" stroke="#111013" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85"/><path d="M108.5 90C108.5 92.5 106.5 94.5 104 94.5C101.5 94.5 99.5 92.5 99.5 90C99.5 87.5 101.5 85.5 104 85.5C106.5 85.5 108.5 87.5 108.5 90Z" fill="#00CD8F"/><path d="M120 20L600 20C608.8 20 616 27.2 616 36L616 144C616 152.8 608.8 160 600 160L120 160C111.2 160 104 152.8 