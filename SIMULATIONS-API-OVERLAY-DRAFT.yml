# STAGING DRAFT — Simulations API parameter descriptions (overlay format)
# NOT wired into the build. Paste these under `components.schemas` in
# fern/apis/api/openapi-overrides.yml ONCE the /eval/simulation/* endpoints are
# in fern/apis/api/openapi.json (i.e., after the backend makes them public and
# `fern api update` syncs them in). Until then, adding them to the live overlay
# risks breaking `fern check` (nothing to attach to).
#
# Source of shapes: local extended spec (http://localhost:3001/api-extended-json), 2026-07-28.
# Style: §3.5 — say what it is + what it controls; state formats/enums/defaults; "for example"; sentence case.
# [VERIFY] = confirm meaning against source/product before publish.
# Note: avoids "caller" for the tester (pending tester/caller term decision).

components:
  schemas:
    CreatePersonalityDTO:
      properties:
        name:
          description: The display name of the personality, for example "Impatient customer".
        assistant:
          description: >-
            The assistant configuration for the AI tester — the model, voice, and system
            prompt that determine how the tester behaves during the conversation.
        path:
          description: "[VERIFY] Optional folder path used to organize the personality."

    CreateScenarioDTO:
      properties:
        name:
          description: The display name of the scenario, for example "Book an appointment".
        instructions:
          description: >-
            What the tester should try to accomplish in the conversation. Write it as the
            tester's goal, for example "Book an appointment for next week and confirm the time."
        evaluations:
          description: >-
            The checks that decide whether a run passes. Each evaluation compares a structured
            output against an expected value. At least one evaluation is required to run.
        toolMocks:
          description: >-
            Mock results for the target assistant's tools during the simulation, so the run
            stays deterministic without calling real services.

    EvaluationPlanItem:
      properties:
        structuredOutputId:
          description: >-
            The ID of an existing structured output to evaluate. Use this to reuse a structured
            output across scenarios. Provide either structuredOutputId or an inline structuredOutput.
        structuredOutput:
          description: >-
            An inline structured output to evaluate, defined by its name and schema. Provide
            either this or structuredOutputId.
        comparator:
          description: >-
            How the structured output value is compared against value. One of =, !=, >, <, >=, <=.
        value:
          description: The expected value the structured output is compared against, for example true.
        required:
          description: "[VERIFY default] Set to true to require this evaluation to pass for the run to pass."

    ScenarioToolMock:
      properties:
        toolName:
          description: The name of the target assistant's tool to mock. Must match the tool's name exactly.
        result:
          description: The result string returned to the assistant in place of calling the real tool.
        enabled:
          description: Set to true to apply this mock during the simulation.

    CreateSimulationDTO:
      properties:
        name:
          description: Optional display name for the simulation.
        scenarioId:
          description: The ID of the scenario to run.
        personalityId:
          description: The ID of the personality the tester uses.

    CreateSimulationSuiteDTO:
      properties:
        name:
          description: The display name of the suite.
        simulationIds:
          description: The IDs of the simulations included in the suite.
        slackWebhookUrl:
          description: "[VERIFY] A Slack incoming-webhook URL notified when the suite runs."
        targetAssignments:
          description: "[VERIFY] The assistants or squads the suite's simulations run against."
