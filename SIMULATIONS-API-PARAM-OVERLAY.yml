# STAGING — Simulations run-item PARAMETER descriptions (OpenAPI Overlay).
# NOT wired into the build yet. These params (on the advanced run-item endpoints) exist only in the
# extended spec today; a JSONPath overlay can only target them once they're in openapi.json.
#
# WHEN THE ENDPOINTS ARE PUBLISHED + SYNCED (see process in SIMULATIONS-DOCS-PLAN.md):
#   1. Move this file to fern/apis/api/sim-param-overlay.yml
#   2. Reference it in fern/apis/api/generators.yml under the spec:
#        - openapi: ./openapi.json
#          overrides: ./openapi-overrides.yml
#          overlays:
#            - ./sim-param-overlay.yml
#   3. Build/preview and verify; run fern check.
#
# Each action sets ONLY `description` on an existing parameter, preserving its type/required
# (Fern's recommended granular mechanism — see the audiences/overlay docs).
# [VERIFY] force wording against source before publish.

overlay: 1.0.0
info:
  title: Simulations run-item parameter descriptions
  version: 0.0.1
actions:
  - target: "$.paths['/eval/simulation/run/{id}/item'].get.parameters[?(@.name=='id')]"
    update:
      description: The ID of the simulation run.
  - target: "$.paths['/eval/simulation/run/{id}/item'].get.parameters[?(@.name=='simulationId')]"
    update:
      description: Filters run items to a specific simulation.
  - target: "$.paths['/eval/simulation/run/{id}/item'].get.parameters[?(@.name=='runId')]"
    update:
      description: Filters run items to a specific run.
  - target: "$.paths['/eval/simulation/run/{id}/item'].get.parameters[?(@.name=='status')]"
    update:
      description: Filters run items by status.
  - target: "$.paths['/eval/simulation/run/{id}/item/{itemId}'].get.parameters[?(@.name=='id')]"
    update:
      description: The ID of the simulation run.
  - target: "$.paths['/eval/simulation/run/{id}/item/{itemId}'].get.parameters[?(@.name=='itemId')]"
    update:
      description: The ID of the run item.
  - target: "$.paths['/eval/simulation/run/{id}/item/{itemId}'].patch.parameters[?(@.name=='id')]"
    update:
      description: The ID of the simulation run.
  - target: "$.paths['/eval/simulation/run/{id}/item/{itemId}'].patch.parameters[?(@.name=='itemId')]"
    update:
      description: The ID of the run item.
  - target: "$.paths['/eval/simulation/run/{id}/item/{itemId}/generate'].post.parameters[?(@.name=='id')]"
    update:
      description: The ID of the simulation run.
  - target: "$.paths['/eval/simulation/run/{id}/item/{itemId}/generate'].post.parameters[?(@.name=='itemId')]"
    update:
      description: The ID of the run item.
  - target: "$.paths['/eval/simulation/run/{id}/item/{itemId}/generate'].post.parameters[?(@.name=='force')]"
    update:
      description: "[VERIFY] Set to `true` to regenerate improvement suggestions even if they already exist."
