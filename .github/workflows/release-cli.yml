name: Release CLI

on:
  workflow_call:
    inputs:
      version:
        description: CLI version to generate (opens a pull request; does not publish)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: CLI version to generate (opens a pull request; does not publish)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Fern
        run: npm install -g fern-api
      - name: Generate CLI pull request
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
          CLI_VERSION: ${{ inputs.version }}
        run: fern generate --api cli --group cli-sdk --version "$CLI_VERSION" --mode pull-request --log-level debug
