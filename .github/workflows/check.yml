name: Fern Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fern-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-fern

      - name: Validate docs, links, and API configuration
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: node scripts/fern/run.cjs check --warnings
