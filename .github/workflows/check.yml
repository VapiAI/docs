name: Fern Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  fern-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-fern

      - name: Check API is valid
        run: node scripts/fern/run.cjs check

  docs-consent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern
      - name: Install browser regression dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test consent and subscription logic
        run: |
          npm run test:privacy
          node fern/custom.spec.js
      - name: Verify generated local Fern consent behavior
        run: npm run test:privacy:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-consent-requests
          path: ${{ runner.temp }}/docs-privacy-results
          retention-days: 7
