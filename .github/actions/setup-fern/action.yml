name: Set up Fern with an example cache
description: Install the pinned CLI and restore generated API examples without skipping validation.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22.22.2
    - name: Install pinned Fern
      shell: bash
      run: |
        npm install --prefix "$RUNNER_TEMP/vapi-fern" --no-save --no-audit --no-fund fern-api@5.112.0
        echo "FERN_CLI_PATH=$RUNNER_TEMP/vapi-fern/node_modules/fern-api/cli.cjs" >> "$GITHUB_ENV"
    - name: Test cache safeguards
      shell: bash
      run: node --test scripts/fern/example-cache.test.cjs
    - uses: actions/cache@v4
      with:
        path: .cache/fern-examples
        key: fern-examples-v2-${{ runner.os }}-${{ runner.arch }}-node22.22.2-${{ hashFiles('fern/fern.config.json', 'scripts/fern/run.cjs', 'scripts/fern/example-cache.cjs', 'scripts/fern/register.cjs') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          fern-examples-v2-${{ runner.os }}-${{ runner.arch }}-node22.22.2-${{ hashFiles('fern/fern.config.json', 'scripts/fern/run.cjs', 'scripts/fern/example-cache.cjs', 'scripts/fern/register.cjs') }}-
